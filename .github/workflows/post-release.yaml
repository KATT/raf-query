jobs:
  post_release:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo "npm_version=$(npm pkg get version --prefix packages/react | tr -d '"')" >> "$GITHUB_ENV"
      - uses: apexskier/github-release-commenter@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :tada: This is included in version {release_link} :tada:

            The release is available on:

            * [GitHub releases](https://github.com/KATT/raf-query/releases/tag/{release_tag})
            * [`@raf-query/react` on npm](https://www.npmjs.com/package/@raf-query/react/v/${{ env.npm_version }})
            * [`@raf-query/core` on npm](https://www.npmjs.com/package/@raf-query/core/v/${{ env.npm_version }})

            Cheers! 📦🚀

name: Post Release

on:
  release:
    types:
      - published
