jobs:
  sync:
    name: Sync the stackblitz branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/prepare
      # Regenerates the copies, waits until npm serves the version Release just
      # published, installs and builds each copy, and pushes if anything changed.
      - run: pnpm --filter @tooling/stackblitz sync

name: StackBlitz

# After Release, so the `@raf-query/*` version in `packages/*/package.json` is
# on npm.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}
