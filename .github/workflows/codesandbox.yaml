jobs:
  sync:
    # Release also runs, and skips its job, for its own "chore: release"
    # commit. That run has nothing new to sync.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Sync the codesandbox branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/prepare
      # The copies' build caches, saved under a new key every run and restored
      # from the latest one.
      - uses: actions/cache@v4
        with:
          key: codesandbox-build-${{ github.run_id }}
          path: ${{ runner.temp }}/codesandbox-build-cache
          restore-keys: codesandbox-build-
      # Regenerates the copies, waits until npm serves the version Release just
      # published, installs and builds each copy, and pushes if anything changed.
      - run: pnpm --filter @tooling/codesandbox sync "$RUNNER_TEMP/codesandbox-build-cache"

name: CodeSandbox

# After Release, so the `@raf-query/*` version in `packages/*/package.json` is
# on npm.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}
