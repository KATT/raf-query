concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - name: Pack the packages
        run: |
          pnpm --dir packages/core pack --out "$RUNNER_TEMP/core.tgz"
          pnpm --dir packages/react pack --out "$RUNNER_TEMP/react.tgz"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the packed packages as a consumer would, on the oldest supported Node
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --engine-strict "$RUNNER_TEMP/core.tgz" "$RUNNER_TEMP/react.tgz" react
          node -e "import('@raf-query/react').then((m) => console.log(m.name))"

  build_www:
    name: Build www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm build:www

  build_examples:
    name: Build Examples
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      # Next.js keeps Turbopack compile artifacts in `.next/cache`. Restore the
      # latest for this lockfile; save under a new key every run (same pattern
      # as codesandbox.yaml). Vercel already persists this for deploys.
      - uses: actions/cache@v4
        with:
          key: nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          path: |
            examples/nextjs/.next/cache
            .experimental/tanstack-query/nextjs/.next/cache
          restore-keys: |
            nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-build-
      - run: pnpm build:examples

  engines_check:
    name: Engines Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm --filter "./packages/*" install --prod --engine-strict --ignore-scripts

  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      # Coverage stays available locally (`pnpm test --coverage`); CI stopped
      # uploading because Codecov rejected every run with HTTP 429 (no token).
      - run: pnpm test

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm typecheck

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
