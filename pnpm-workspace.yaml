packages:
  - "packages/*"

catalog:
  "@effect/platform-node": 4.0.1
  "@effect/vitest": 4.0.1
  effect: ^4.0.1

# Keep plugins such as @effect/vitest on the Vitest copy bundled by vite-plus.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

peerDependencyRules:
  allowedVersions:
    vite: 1.0.0
