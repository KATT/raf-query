<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.tile { fill: #0a0a0a; }
		.bar { fill: #fafafa; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #fafafa; }
			.bar { fill: #0a0a0a; }
		}
	</style>
	<rect class="tile" width="32" height="32" rx="8" />
	<rect class="bar" x="7" y="8" width="18" height="4" rx="2" />
	<rect class="bar" x="7" y="14" width="12" height="4" rx="2" opacity="0.75" />
	<rect class="bar" x="7" y="20" width="15" height="4" rx="2" opacity="0.5" />
</svg>
